[project]
name = "nativepeers"
version = "0.1.0"
description = "Native local peer messaging and owned cross-provider workers"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "tomlkit==0.15.2"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "hypothesis==6.170.5", "jsonschema==4.26.0"]

[project.scripts]
npeer = "nativepeers.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
